# agent.yaml
# This file contains training parameters for the AI agent.

network:
  hidden_layers: [128, 128] # number of neurons in each hidden layer
  activation: "relu" # activation function for hidden layers
  output_activation: "linear" # activation function for output layer
  # The input block encodes each fighter to embed_dim values and attends over the opponents;
  # the hidden layers then get [own embedding ; attention context] (2 * embed_dim values).
  embed_dim: 64
  num_heads: 4 # must divide embed_dim; 4 heads let separate threats get separate attention

policy:
  clip_range: 0.2 # clipping range for policy updates
  learning_rate: 0.0003 # learning rate for the optimizer
  discount_factor: 0.99 # discount factor for future rewards
  gae_lambda: 0.95 # lambda parameter for Generalized Advantage Estimation
  num_epochs: 4 # number of epochs for training
  batch_size: 512 # size of each training batch
  value_loss_coef: 0.5 # coefficient for value loss in the total loss function
  entropy_coef: 0.011 # coefficient for entropy in the total loss function

training:
  iterations: 5000 # rollout-and-update cycles, not episodes: each collects rollout_steps steps
  rollout_steps: 512 # transitions collected before each policy update
  checkpoint_interval: 100 # iterations between checkpoint saves
  seed: null # optional seed for the initial environment reset
  # One environment per entry, in order. Each entry lists the opponents the agent faces at
  # once in that environment (1 to game.yaml observation.max_opponents names from approach,
  # parrier, idle, runner, random). A bare name means one opponent. Opponents are allies:
  # they never hurt each other, and a fight ends when the agent or all of them are dead.
  # Repeat an entry to run several environments with it. Here seven of sixteen are
  # one-on-one (two against the perfect-parry hunter, which parries every attack it can
  # see from the front), five have two opponents and four have three. Most multi-opponent
  # entries have opponents that all attack (parrier and approach). Easy opponents
  # (idle, random) keep a winning signal.
  opponents:
    [
      [parrier],
      [runner],
      [approach],
      [random],
      [idle],
      [random],
      [approach, approach],
      [parrier, approach],
      [parrier, random],
      [approach, runner],
      [approach, idle],
      [parrier, approach, approach],
      [parrier, parrier, parrier],
      [approach, approach, idle],
      [parrier, random, approach],
      [random, runner, idle],
    ]
  num_envs: 16 # the most environments allowed: training refuses to start with more entries
  randomize_spawns: true # random fighter start positions each episode
  # Redraw the scripted opponents' options each episode, so no fixed distance or timing can be
  # learned. Only approach and parrier have options (see agents/scripted/episode.py).
  randomize_opponents: true
  # Meters added to the distance at which approach and parrier start a swing. Drawn uniformly
  # from this [low, high] range per episode: negative walks closer first, positive swings
  # early (they keep walking during the wind-up, so the gap still closes).
  swing_start_offset_m: [-0.2, 0.4]
  # Range of the parrier's per-step chance to attack a learner that is not walking away.
  hunter_attack_chance: [0.1, 0.4]
  max_episode_steps: 1500 # episode time limit in sim steps (25 s at 60 Hz); null = 10 s
  stats_window: 100 # recent episodes used for the rolling episode stats (overall and per opponent)
  print_stats: true # print the training statistics (set false for silent training)
  print_interval: 100 # iterations between printed statistics (same as checkpoint_interval)
