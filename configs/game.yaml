# game.yaml
# This YAML file contains the parameter values used by the game.
world:
  gravity_mps2: 19.6 # derived from jump height and time to peak
  sim_hz: 60 # fixed timestep (1/60)
  arena_width_m: 12.0
  floor_y_m: 0.0

fighter:
  max_health: 100
  move_speed_mps: 4.0
  jump_velocity_mps: 6.9
  height_m: 0.9
  width_to_height_ratio: 0.3

combat:
  # Each entry of attacks is one attack type with its own timing, damage and range. The keys
  # must match AttackType in config.py. The agent can only start slash: counter is granted
  # by a parry (counter_window_frames below). A new type needs an AttackType member and an
  # entry here. It adds one attack_type_<name> observation feature, so bump spec_version.
  # All "frames" below are simulation steps (1/60 s each). A swing runs attack_windup_frames,
  # then attack_active_frames, then attack_recovery_frames, in that order.
  # Frames from starting a swing until its first damaging frame. Nothing can hit during
  # these, so this is how long the opponent has to see the swing and parry. The sprite
  # shown on the first damaging frame is (attack_windup_frames + 1) // frame_duration.attack
  # in viewer.yaml.
  attacks:
    # basic slash attack
    slash:
      attack_windup_frames: 16
      # Frames in which the swing can hit, right after the wind-up. One swing hits at most once.
      attack_active_frames: 4
      # Frames after the active frames in which the swing cannot hit and no new attack can
      # start. It is the attacker's cooldown.
      attack_recovery_frames: 14
      damage: 10
      range_m: 0.8
    # The swing after a successful parry: a shorter wind-up and a lunge toward the
    # opponent, fixed in direction when the counter starts.
    counter:
      attack_windup_frames: 12
      attack_active_frames: 4
      attack_recovery_frames: 14
      damage: 15 # of each enemy it hits
      range_m: 0.8
      lunge_speed_mps: 6.0 # horizontal speed during the wind-up
      # After the first active frame (the hit) the lunge carries on for up to
      # lunge_carry_frames, at lunge_carry_speed_mps, until the fighter is
      # lunge_clearance_reaches times the swing's reach (body width 0.27 m plus range_m, 1.07 m)
      # beyond the enemy it cut through. At 1.25 that is 1.34 m, outside the enemy's swing
      # range, so the enemy has to walk before it can hit back. The target follows the enemy,
      # which can still walk (4 m/s) after the lunger while staggered, so the carry is fast:
      # it gains 10 m/s on a chasing enemy and needs about 9 of the 10 frames for 1.34 m.
      lunge_carry_frames: 10
      lunge_carry_speed_mps: 14.0
      lunge_clearance_reaches: 1.25
      # Only a counter's hitbox reaches behind the attacker's center, by this much. The lunge
      # passes through bodies, so an opponent can walk through the lunging attacker: in the 13
      # steps up to the first hit it walks 0.87 m, so its body edge can end 0.73 m behind the
      # attacker's center. A normal swing starts at the attacker's front edge and never
      # reaches behind it.
      hitbox_back_m: 0.8
  # Parry: a press opens a protected window, then a fixed recovery. Holding the
  # button parries once. The window halves with every press made soon after the
  # last parry (spam), down to a minimum, and resets after a success or a pause.
  # Frames right after the press in which an attack that hits is parried, for a parry
  # started after a pause (about 133 ms at 8). Spamming shrinks it, never below
  # parry_min_window_frames. The shield animation is drawn over exactly these frames.
  parry_window_frames: 9
  # Frames after the protected window in which the fighter cannot move, jump, attack or
  # parry again and is not protected. Always the same length, however far spam shrank
  # the window. A parry that stops an attack skips it.
  parry_recovery_frames: 12
  # The shortest the protected window can get from spamming, in frames. Set it equal to
  # parry_window_frames to turn the spam penalty off.
  parry_min_window_frames: 7
  parry_window_decay: 0.5 # window multiplier for each press made within the reset time
  # Frames since the last parry ended after which the next press gets the full window
  # again (30 is 500 ms). A press made sooner counts as spam and shrinks the window.
  parry_spam_reset_frames: 30
  # A successful parry in the air gives an upward impulse (never above the cap) and
  # reduced gravity for a while, so the fighter stays near its height for the counter.
  parry_hover_impulse_mps: 5.0
  parry_hover_max_vy_mps: 2.5
  parry_hover_gravity_scale: 0.3
  # Frames after a successful air parry during which gravity is scaled by
  # parry_hover_gravity_scale. Ends early on landing.
  parry_hover_frames: 30
  # After a successful parry the next attack is a counter (the ``counter`` attack above):
  # Frames after a successful parry in which the parrying fighter's next attack is a
  # counter. The window ends when it attacks or when the frames run out.
  counter_window_frames: 24
  # Frames after its swing is parried in which the attacker cannot start an attack. It
  # replaces the rest of the swing, so compare it with attack_recovery_frames. The
  # attacker can still move and parry. The viewer plays the swing backwards over these.
  parried_stagger_frames: 28

dodge:
  # A dodge is a short burst along the move direction (the facing direction when none is
  # held), fixed when the dodge starts. For the whole burst the fighter takes no damage and
  # passes through other fighters.
  # The burst covers speed_mps * duration_frames / 60 = 1.47 m. A dodge started touching an
  # enemy ends 1.2 m past its center, just outside its swing range (body width 0.27 m plus
  # the attack range 0.8 m is 1.07 m), so the enemy cannot turn round and hit at once.
  speed_mps: 11.0
  duration_frames: 8 # frames of invulnerability and movement
  gap_frames: 4 # frames after the dodge ends before the next dodge can start
  max_stamina: 100 # max stamina points
  cost: 50 # stamina points spent per dodge
  regen_per_second: 35.0 # stamina points regenerated per second

observation:
  # spec_version is saved in checkpoints, which refuse to load at another version.
  # reaction_delay_frames is loaded but has no effect: observations are never delayed.
  spec_version: 6
  reaction_delay_frames: 0
  max_observed_height_m: 1.3
  # Opponent slots in the observation (the network input is padded and masked to this many).
  # Raise it to train against more opponents at once. Old checkpoints no longer fit.
  max_opponents: 3
