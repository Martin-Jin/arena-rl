# Viewer-only display, animation, and audio settings.
rendering:
  screen_width: 1280
  screen_height: 720
  pixels_per_meter: 100
  floor_y_px: 650

animation:
  source_body_height_px:
    idle: 21
    run: 21
    attack: 20
    turn: 21
    parry: 21
    dodge: 21
  frame_duration: # simulation steps (1/60 s) each sprite of the animation is shown for
    idle: 6
    run: 4
    attack: 3
    turn: 1
    parry: 1 # unused: the parry animation is stretched over the parry frames
    dodge: 1 # unused: the dodge animation is stretched over the burst and the gap
  loop:
    idle: true
    run: true
    attack: false
    turn: false
    parry: false
    dodge: false

audio:
  # Default levels. The settings menu overrides them and remembers the choice.
  # Applied after per-file RMS/peak normalization.
  effects_volume: 0.5
  # Music master volume.
  music_volume: 0.10
  # Runtime normalization targets. Source files are not modified.
  normalization_rms: 0.18
  normalization_peak: 0.95
  running_fade_ms: 250
  # When a match ends (a win, a defeat or a draw) the music stops at once and every sound
  # effect still playing fades out over this many milliseconds.
  match_end_fade_ms: 1200
  effects:
    attack: sword_swing.mp3
    counter: counter.mp3 # played in place of the attack sound when a counter attack starts
    hit: hit.mp3
    jump: jump.mp3
    landing: jump_landing.mp3
    running: running.mp3
    shield_raise: shield_raise.mp3 # played when a fighter starts a parry
    # Every name starting with "parry" is one of the sounds a parry alternates between.
    parry_1: parry1.mp3
    parry_2: parry2.mp3
  music: battle_music.mp3

match:
  # A match that is still running after this many seconds ends on health (a draw
  # if equal). 0 removes the limit. Training has its own limit, max_episode_steps.
  time_limit_seconds: 60

opponent:
  # Checkpoint used by the "Trained agent" choices, relative to the repository.
  checkpoint_path: checkpoints/latest.pt

ui:
  # The first installed font in this list is used; pygame's default is the fallback.
  font_names: [segoe ui semilight, helvetica neue, helvetica, arial]
  font_sizes:
    title: 88
    heading: 48
    body: 26
    small: 20
  overlay_alpha: 150
  health_bar_width: 400
  health_bar_height: 18
  health_bar_margin: 40
  health_bar_y: 22
  # A damage trail stays for this long, then drains this fraction of max health per second.
  health_trail_delay_seconds: 0.4
  health_trail_speed: 0.5
  # "Ready" is shown while the fight is paused, then "Fight!" fades out.
  ready_seconds: 0.9
  fight_banner_seconds: 0.7
  controls_hint_seconds: 8.0
  damage_text_seconds: 0.9
  # A fighter that is hurt flashes: for this many seconds it fades down toward the
  # damage_taken color and this opacity (0-255), then back to normal.
  hurt_flash_seconds: 0.35
  hurt_flash_min_alpha: 110
  # While a fighter's parry window is open a bubble outline shows on the side it faces, in
  # its side's color (the accent color for the agent, opponent_health for the opponent,
  # and the same for the parry flash, Parry and Counter texts and the counter line). It
  # has no fill and does not fade. The border is this many pixels thick, the radius is
  # this share of the fighter's height, and the arc is this many degrees (180 is a half
  # circle). It burns away from both ends over the window, so by the last frame only
  # (1 - parry_bubble_burn) of the arc is left, and then it is gone.
  parry_bubble_border_px: 3
  parry_bubble_radius_scale: 0.7
  parry_bubble_arc_degrees: 200
  parry_bubble_burn: 0.6
  # The edge is uneven, like a flame: its radius wobbles by up to this share of the radius
  # (more toward the ends and as the window runs out), flickering at this many radians of
  # animation per frame.
  parry_flame_amplitude: 0.12
  parry_flame_speed: 0.9
  # Each end of the arc sheds particles every frame. A particle lasts this many frames,
  # flows backward along the bubble's surface by this many degrees per frame, drifts
  # outward by this share of the radius per frame, and is this many pixels wide.
  parry_particle_life_frames: 14
  parry_particle_speed_deg: 7
  parry_particle_drift: 0.03
  parry_particle_size_px: 3
  # A successful parry shows a ring and sparks that grow to this radius in pixels over
  # this many seconds.
  parry_flash_seconds: 0.35
  parry_flash_radius: 70
  # A counter attack cuts a straight line that follows the fighter, and a "Counter" text.
  # If the counter hits, the line carries on this many meters past the opponent. If it is
  # parried, the line stops at the parrying fighter. Once the line has stopped it fades
  # out over counter_effect_seconds.
  counter_effect_seconds: 0.4
  counter_line_width_px: 4
  counter_line_carry_m: 0.8
  # A dodge leaves faint copies of the fighter behind it. A copy starts at
  # dodge_trail_alpha (0 to 255) and fades out over dodge_trail_seconds. One is left every
  # dodge_trail_spacing_seconds of the burst.
  dodge_trail_alpha: 90
  dodge_trail_seconds: 0.25
  dodge_trail_spacing_seconds: 0.03
  colors:
    background: [244, 245, 247]
    floor: [226, 229, 234]
    floor_line: [196, 202, 211]
    panel: [255, 255, 255]
    panel_border: [225, 228, 233]
    text: [28, 32, 40]
    text_muted: [120, 128, 140]
    accent: [59, 110, 235]
    accent_hover: [41, 92, 214]
    on_accent: [255, 255, 255]
    button: [255, 255, 255]
    button_hover: [238, 242, 250]
    button_border: [214, 219, 227]
    track: [222, 226, 232]
    overlay: [20, 24, 32]
    shadow: [30, 35, 45]
    agent_health: [52, 168, 100]
    opponent_health: [222, 76, 76]
    health_background: [231, 234, 239]
    health_trail: [243, 201, 112]
    damage_dealt: [38, 140, 84]
    damage_taken: [214, 64, 64]
    swing_windup: [240, 170, 60]
    swing_active: [222, 76, 76]
    swing_recovery: [160, 168, 180]
    victory: [38, 140, 84]
    defeat: [214, 64, 64]
    opponent_tint: [255, 140, 140]
    fallback_agent: [59, 110, 235]
    fallback_opponent: [200, 70, 70]
