# Viewer-only display, animation, and audio settings.
rendering:
  screen_width: 1280
  screen_height: 720
  pixels_per_meter: 100
  floor_y_px: 650

animation:
  source_body_height_px:
    idle: 21
    run: 21
    attack: 20
    turn: 21
  frame_duration:
    idle: 6
    run: 4
    attack: 3
    turn: 1
  loop:
    idle: true
    run: true
    attack: false
    turn: false

audio:
  # Default levels. The settings menu overrides them and remembers the choice.
  # Applied after per-file RMS/peak normalization.
  effects_volume: 0.5
  # Music master volume.
  music_volume: 0.10
  # Runtime normalization targets. Source files are not modified.
  normalization_rms: 0.18
  normalization_peak: 0.95
  running_fade_ms: 250
  effects:
    attack: sword_swing.mp3
    hit: hit.mp3
    jump: jump.mp3
    landing: jump_landing.mp3
    running: running.mp3
  music: battle_music.mp3

match:
  # A match that is still running after this many seconds ends on health (a draw
  # if equal). 0 removes the limit. Training has its own limit, max_episode_steps.
  time_limit_seconds: 60

opponent:
  # Checkpoint used by the "Trained agent" choices, relative to the repository.
  checkpoint_path: checkpoints/latest.pt

ui:
  # The first installed font in this list is used; pygame's default is the fallback.
  font_names: [segoe ui semilight, helvetica neue, helvetica, arial]
  font_sizes:
    title: 88
    heading: 48
    body: 26
    small: 20
  overlay_alpha: 150
  health_bar_width: 400
  health_bar_height: 18
  health_bar_margin: 40
  health_bar_y: 22
  # A damage trail stays for this long, then drains this fraction of max health per second.
  health_trail_delay_seconds: 0.4
  health_trail_speed: 0.5
  # "Ready" is shown while the fight is paused, then "Fight!" fades out.
  ready_seconds: 0.9
  fight_banner_seconds: 0.7
  controls_hint_seconds: 8.0
  damage_text_seconds: 0.9
  colors:
    background: [244, 245, 247]
    floor: [226, 229, 234]
    floor_line: [196, 202, 211]
    panel: [255, 255, 255]
    panel_border: [225, 228, 233]
    text: [28, 32, 40]
    text_muted: [120, 128, 140]
    accent: [59, 110, 235]
    accent_hover: [41, 92, 214]
    on_accent: [255, 255, 255]
    button: [255, 255, 255]
    button_hover: [238, 242, 250]
    button_border: [214, 219, 227]
    track: [222, 226, 232]
    overlay: [20, 24, 32]
    shadow: [30, 35, 45]
    agent_health: [52, 168, 100]
    opponent_health: [222, 76, 76]
    health_background: [231, 234, 239]
    health_trail: [243, 201, 112]
    damage_dealt: [38, 140, 84]
    damage_taken: [214, 64, 64]
    swing_windup: [240, 170, 60]
    swing_active: [222, 76, 76]
    swing_recovery: [160, 168, 180]
    victory: [38, 140, 84]
    defeat: [214, 64, 64]
    opponent_tint: [255, 140, 140]
    fallback_agent: [59, 110, 235]
    fallback_opponent: [200, 70, 70]
